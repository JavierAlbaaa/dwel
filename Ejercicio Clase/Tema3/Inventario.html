<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        const inventario = [
            { nombre: "Iphone 14", precio: 400, stock: 8 },
            { nombre: "Iphone 15", precio: 550, stock: 3 },
            { nombre: "Iphone 16", precio: 800, stock: 2 },
            { nombre: "Iphone 18", precio: 1200, stock: 10 }
        ];

        let total = 0;

        console.log("Productos con menos de 5 unidades:");

        for (let i = 0; i < inventario.length; i++) {
            if (inventario[i].stock < 5) {
                console.log(inventario[i].nombre + " (" + inventario[i].stock + " unidades)");
            }
            total += inventario[i].precio * inventario[i].stock;
        }

        console.log("Valor total del inventario: " + total + " €");
    </script>
</body>

</html>
