<body>
    <script>

function suma(a, b) {
    return a + b;
}


function resta(a, b) {
    return a - b;
}


function multiplicacion(a, b) {
    return a * b;
}

function division(a, b) {
    if (b === 0) {
        return "Erro  no se puede dividir entre cero";
    }
    return a / b;
}

    </script>
