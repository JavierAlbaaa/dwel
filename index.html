<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi página web</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            color: #333;
            text-align: center;
        }

        header {
            background: #24292f;
            color: white;
            padding: 60px 20px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        main {
            padding: 40px 20px;
        }

        .boton {
            display: inline-block;
            padding: 12px 24px;
            background: #0969da;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            margin-top: 20px;
        }

        .boton:hover {
            background: #0555ae;
        }
    </style>
</head>

<body>

    <header>
        <h1>¡Hola! Soy Javier Alba</h1>
        <p>Bienvenido a mi página web</p>
    </header>

    <main>
        <h2>Mi sitio web</h2>
        <p>Esta página está creada con HTML y publicada con GitHub Pages.</p>

        <a href="#" class="boton">Mi botón</a>
    </main>

</body>
</html>
