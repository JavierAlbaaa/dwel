<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambio de imágenes</title>
</head>

<body>

    <h1>Cambio de imágenes con JavaScript</h1>

    <img id="diasoleado"
         onclick="cambiaPic()"
         src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT7HHTRJpP6dkm76ml3mPMi3DjSqyNOHn3_1Bz1VT0YJg&s=10"
         width="100"
         height="180">

    <p>Haz click sobre la imagen para cambiarla</p>

    <script>
        function cambiaPic() {
            var image = document.getElementById("diasoleado");

            if (image.src.includes("encrypted-tbn0")) {
                image.src = "https://www.tourismelandes.com/wp-content/uploads/2019/03/2xaventures-bivouac-soiree.jpg";
            } else {
                image.src = "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT7HHTRJpP6dkm76ml3mPMi3DjSqyNOHn3_1Bz1VT0YJg&s=10";
            }
        }
    </script>

</body>
</html>
